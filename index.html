<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Luth Wrestling Academy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    /* NAVIGATION */

    nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 32px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 8%;
      position: relative;

      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,.92) 0%,
          rgba(0,0,0,.72) 50%,
          rgba(0,0,0,.45) 100%
        ),
        url("hero.jpg");

      background-size: cover;
      background-position: center;
    }

    .hero-content {
      max-width: 850px;
    }

    .eyebrow {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(58px, 9vw, 125px);
      line-height: .86;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: -5px;
      margin-bottom: 28px;
    }

    .hero p {
      font-size: 20px;
      line-height: 1.6;
      max-width: 600px;
      color: #d4d4d4;
      margin-bottom: 38px;
    }

    /* BUTTONS */

    .buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 17px 27px;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 800;
      transition: .2s;
    }

    .btn-primary {
      background: white;
      color: black;
    }

    .btn-primary:hover {
      background: #d8d8d8;
    }

    .btn-secondary {
      border: 1px solid #777;
      color: white;
    }

    .btn-secondary:hover {
      background: white;
      color: black;
    }

    /* INTRO */

    .intro {
      background: white;
      color: #111;
      padding: 110px 8%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }

    .section-label {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .intro h2 {
      font-size: clamp(42px, 6vw, 78px);
      line-height: .95;
      text-transform: uppercase;
      letter-spacing: -3px;
    }

    .intro-text p {
      font-size: 18px;
      line-height: 1.7;
      color: #555;
      margin-bottom: 24px;
    }

    /* PROGRAMS */

    .programs {
      padding: 110px 8%;
      background: #111;
    }

    .programs h2 {
      font-size: clamp(42px, 6vw, 72px);
      text-transform: uppercase;
      letter-spacing: -3px;
      margin-bottom: 55px;
    }

    .program-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .program {
      background: #1b1b1b;
      padding: 48px 38px;
      min-height: 330px;
      display: flex;
      flex-direction: column;
    }

    .program-number {
      color: #777;
      font-size: 13px;
      margin-bottom: 70px;
    }

    .program h3 {
      font-size: 30px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .program p {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .program a {
      color: white;
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
